name: Sync merged code

'on':
  push:
    branches: ['**']
  # The next default-branch push catches up on missed commits. To catch up sooner,
  # dispatch on the default branch and select apply.
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes (check) or sync from the last confirmed commit (apply)
        type: choice
        default: check
        options:
          - check
          - apply

permissions: {}

jobs:
  bridge:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: gitcode-sync
    concurrency:
      group: gitcode-sync
      queue: max
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the merged source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply the selected operation
        env:
          GITCODE_SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'apply' }}
          GITCODE_SYNC_CONFIG_JSON: ${{ secrets.GITCODE_SYNC_CONFIG_JSON }}
          GITCODE_ROBOT_TOKEN: ${{ secrets.GITCODE_ROBOT_TOKEN }}
          GITCODE_MEMBER_EXAMPLE_TOKEN: ${{ secrets.GITCODE_MEMBER_EXAMPLE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          umask 077
          : "${GITCODE_SYNC_CONFIG_JSON:?Set GITCODE_SYNC_CONFIG_JSON in the gitcode-sync environment}"
          config="$(mktemp)"
          trap 'rm -f "$config"' EXIT
          printf '%s\n' "$GITCODE_SYNC_CONFIG_JSON" > "$config"
          case "$GITCODE_SYNC_MODE" in
            check|apply) ;;
            *) echo 'GITCODE_SYNC_MODE must be check or apply' >&2; exit 1 ;;
          esac
          python3 -u .github/workflows/bridge/bridge.py \
            --config "$config" --members .github/gitcode-members.json "--$GITCODE_SYNC_MODE"
